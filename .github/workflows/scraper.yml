name: Room Finder Scraper

on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at midday (12:00 UTC)
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Offline Tests (gate deployment)
        run: python -m unittest tests.test_scrapers.TestScrapersOffline -v

      - name: Run Scraper
        run: python main.py

      - name: Validate scraper output before deploying
        run: |
          COUNT=$(python -c "import json; data=json.load(open('properties.json')); print(len(data))")
          echo "Properties scraped: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "❌ DEPLOY BLOCKED: Only $COUNT properties found (minimum 100 required)."
            echo "This likely means most scrapers failed. Skipping deploy to protect the live dashboard."
            exit 1
          fi
          echo "✅ Validation passed. Proceeding to deploy."

      - name: Commit properties.json back to repo (if changed)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -f properties.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update properties.json" && git push)

      - name: Create gh-pages deployment branch
        run: |
          # We isolate the dashboard HTML so GitHub Pages can serve it
          mkdir -p public
          cp commute_matching_rentals.html public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
